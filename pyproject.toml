[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking"
version = "0.1.0"
description = "Five-slot smart parking backend, simulation, and algorithm benchmarks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
ml = ["tensorflow>=2.20,<3", "matplotlib>=3.10,<4"]
review = ["python-docx>=1.1,<2"]
hardware = ["pyserial>=3.5,<4"]

[tool.setuptools.packages.find]
include = ["backend*", "optimization*", "prediction*", "vision*"]

[tool.setuptools.package-data]
"backend.app" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["ml: optional TensorFlow integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "optimization", "prediction", "vision"]
